services:
  - type: web
    name: gold-ai-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 web:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TIMEFRAMES
        value: 5m,15m,1h
