name: Telegram PDH-PDL Research Test

on:
  push:
    branches:
      - feature/telegram-pdh-pdl-research
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile telegram_ar.py research/pdh_pdl_breakout_backtest.py
      - name: Run research backtest
        shell: bash
        run: |
          set +e
          python research/pdh_pdl_breakout_backtest.py --bars 5000 --cost-points 0.5 > research/backtest-run.log 2>&1
          status=$?
          cat research/backtest-run.log
          exit $status
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdh-pdl-gold-results
          path: |
            research/backtest-run.log
            research/results/summary.json
            research/results/successful_breakouts.csv
            research/results/false_breakouts.csv
          if-no-files-found: warn
          retention-days: 14
