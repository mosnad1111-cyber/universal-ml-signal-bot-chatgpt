name: LEAN engine smoke test

on:
  pull_request:
    paths:
      - ".github/workflows/lean-engine-smoke.yml"
      - "lean_smoke/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-engine-smoke:
    # The x64 LEAN image is 13+ GB compressed and cannot fit on a standard
    # 14 GB x64 runner. The official ARM64 image is substantially smaller.
    # ARM64 standard runners are free for public repositories.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker system prune --all --force
          echo "Disk space after cleanup:"
          df -h /

      - name: Prepare isolated LEAN workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lean/Algorithm.Python" "$RUNNER_TEMP/lean/Results"
          cp lean_smoke/LeanSmokeAlgorithm.py lean_smoke/LeanBacktestAlgorithm.py "$RUNNER_TEMP/lean/Algorithm.Python/"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/QuantConnect/Lean/master/Launcher/config.json \
            --output "$RUNNER_TEMP/lean/config.json"
          python - "$RUNNER_TEMP/lean/config.json" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          config = path.read_text(encoding="utf-8")
          replacements = {
              '"algorithm-type-name": "BasicTemplateFrameworkAlgorithm"':
                  '"algorithm-type-name": "LeanSmokeAlgorithm"',
              '"algorithm-language": "CSharp"':
                  '"algorithm-language": "Python"',
              '"algorithm-location": "QuantConnect.Algorithm.CSharp.dll"':
                  '"algorithm-location": "../../../Algorithm.Python/LeanSmokeAlgorithm.py"',
          }
          for old, new in replacements.items():
              if old not in config:
                  raise SystemExit(f"LEAN config template changed; missing {old}")
              config = config.replace(old, new, 1)
          # Keep LEAN's own bundled Data directory mounted in the container.
          # It includes required reference databases (symbol properties,
          # market hours, map/factor files); an empty host mount masks them.
          path.write_text(config, encoding="utf-8")
          PY

      - name: Pull the official ARM64 LEAN engine image
        run: docker pull --platform linux/arm64 quantconnect/lean:latest

      - name: Run LEAN without QuantConnect Cloud or CLI
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            --volume "$RUNNER_TEMP/lean/Algorithm.Python:/Lean/Algorithm.Python:ro" \
            --volume "$RUNNER_TEMP/lean/config.json:/Lean/Launcher/config.json:ro" \
            --volume "$RUNNER_TEMP/lean/Results:/Results" \
            quantconnect/lean:latest \
            --results-destination-folder /Results \
            --config /Lean/Launcher/config.json 2>&1 | tee "$RUNNER_TEMP/lean/lean.log"

      - name: Verify LEAN initialized and completed the Python algorithm
        shell: bash
        run: |
          set -euo pipefail
          grep -q "LEAN_SMOKE_INITIALIZED" "$RUNNER_TEMP/lean/lean.log"
          grep -q "LEAN_SMOKE_COMPLETED" "$RUNNER_TEMP/lean/lean.log"

      - name: Prepare synthetic OHLC execution fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lean/Results/lean-backtest"
          python lean_smoke/create_lean_fixture.py "$RUNNER_TEMP/lean/Algorithm.Python/input"
          python - "$RUNNER_TEMP/lean/config.json" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          config = path.read_text(encoding="utf-8")
          config = config.replace(
              '"algorithm-type-name": "LeanSmokeAlgorithm"',
              '"algorithm-type-name": "LeanBacktestAlgorithm"',
              1,
          )
          config = config.replace(
              '"algorithm-location": "../../../Algorithm.Python/LeanSmokeAlgorithm.py"',
              '"algorithm-location": "../../../Algorithm.Python/LeanBacktestAlgorithm.py"',
              1,
          )
          if '"algorithm-type-name": "LeanBacktestAlgorithm"' not in config:
              raise SystemExit("Could not configure LeanBacktestAlgorithm")
          path.write_text(config, encoding="utf-8")
          PY

      - name: Run LEAN OHLC execution and fee fixture
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            --volume "$RUNNER_TEMP/lean/Algorithm.Python:/Lean/Algorithm.Python:ro" \
            --volume "$RUNNER_TEMP/lean/config.json:/Lean/Launcher/config.json:ro" \
            --volume "$RUNNER_TEMP/lean/Results/lean-backtest:/Results" \
            quantconnect/lean:latest \
            --results-destination-folder /Results \
            --config /Lean/Launcher/config.json 2>&1 | tee "$RUNNER_TEMP/lean/lean-backtest.log"

      - name: Verify LEAN order fills, conservative same-bar handling, and fees
        shell: bash
        run: |
          set -euo pipefail
          grep -q "LEAN_BACKTEST_INITIALIZED" "$RUNNER_TEMP/lean/lean-backtest.log"
          grep -q "LEAN_BACKTEST_COMPLETED" "$RUNNER_TEMP/lean/lean-backtest.log"
          python - "$RUNNER_TEMP/lean/Results/lean-backtest/lean_report.json" <<'PY'
          import json
          import math
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["trades"] == 2, report
          assert [trade["result"] for trade in report["trades_detail"]] == ["TP", "SL"], report
          assert math.isclose(report["gross_r"], 1.0, abs_tol=1e-9), report
          assert math.isclose(report["fees_r"], 0.10, abs_tol=1e-9), report
          assert math.isclose(report["net_r"], 0.90, abs_tol=1e-9), report
          assert report["unfilled_setups"] == 0, report
          assert report["unresolved_trades"] == 0, report
          PY
