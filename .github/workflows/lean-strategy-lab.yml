name: LEAN strategy and threshold research lab
run-name: LEAN strategy x thresholds ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      asset:
        description: Market asset
        required: true
        type: choice
        options: [GOLD, BTC]
      timeframes:
        description: "all or a comma-separated list such as 5m,15m,1h"
        required: true
        type: string
      request_id:
        description: Telegram request correlation ID
        required: true
        type: string
      callback_url:
        description: Render callback URL supplied by the bot
        required: true
        type: string

permissions:
  contents: read

jobs:
  lean-strategy-lab:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Keep Render awake during strategy preparation and replay
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${CALLBACK_URL%/lean-backtest/callback}"
          case "$BASE_URL" in https://*) ;; *) echo "Render callback must be HTTPS"; exit 1 ;; esac
          nohup bash -c '
            while true; do
              curl --fail --silent --show-error --max-time 30 "$1/health" >/dev/null || true
              sleep 300
            done
          ' _ "$BASE_URL" >"$RUNNER_TEMP/lean-lab-render-keepalive.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/lean-lab-render-keepalive.pid"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bot model and market-data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare each strategy with the full Score/AI threshold grid
        env:
          ASSET: ${{ inputs.asset }}
          TIMEFRAMES: ${{ inputs.timeframes }}
          REQUEST_ID: ${{ inputs.request_id }}
          OUTPUT_DIR: ${{ runner.temp }}/lean-lab/input
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TIMEFRAMES" = "all" ]; then
            TF_LIST="5m,15m,1h"
          else
            TF_LIST="$TIMEFRAMES"
          fi
          python scripts/prepare_lean_strategy_lab.py \
            --asset "$ASSET" --timeframes "$TF_LIST" \
            --request-id "$REQUEST_ID" --output-dir "$OUTPUT_DIR"

      - name: Verify shared real OHLC and complete strategy-threshold matrix
        env:
          OUTPUT_DIR: \${{ runner.temp }}/lean-lab/input
          REQUEST_ID: \${{ inputs.request_id }}
          ASSET: \${{ inputs.asset }}
        run: |
          python - <<'PY'
          import csv, json, os, pathlib
          from datetime import datetime, timezone
          root = pathlib.Path(os.environ["OUTPUT_DIR"])
          prepared = json.loads((root / "prepared_summary.json").read_text(encoding="utf-8"))
          if prepared.get("request_id") != os.environ["REQUEST_ID"]:
              raise SystemExit("Combined strategy-lab request ID mismatch.")
          if prepared.get("asset_key") != os.environ["ASSET"]:
              raise SystemExit("Combined strategy-lab asset mismatch.")
          if prepared.get("report_type") != "LEAN real historical strategy-threshold lab":
              raise SystemExit("Unexpected combined strategy-lab report type.")
          if prepared.get("market_data_type") != "real_historical_ohlc" or prepared.get("synthetic_fixture") is not False:
              raise SystemExit("Combined strategy lab requires real historical OHLC.")
          strategies = ("baseline", "trend_pullback", "breakout_retest", "momentum_continuation")
          if tuple(prepared.get("strategy_order", ())) != strategies:
              raise SystemExit("Unexpected strategy set.")
          utc_today = datetime.now(timezone.utc).date()
          for tf, section in prepared.get("timeframes", {}).items():
              meta = section["metadata"]
              end = datetime.fromisoformat(str(meta["end"]).replace("Z", "+00:00"))
              if end.tzinfo is None:
                  end = end.replace(tzinfo=timezone.utc)
              if end.date() >= utc_today:
                  raise SystemExit(f"{tf}: input includes current UTC-day bars.")
              source = str(meta.get("market_data_source", ""))
              if not source or "synthetic" in source.lower():
                  raise SystemExit(f"{tf}: real historical provider is not identified.")
              if meta.get("market_data_type") != "real_historical_ohlc":
                  raise SystemExit(f"{tf}: input is not real historical OHLC.")
              if int(meta.get("raw_bars", 0)) < 1200 or int(meta.get("usable_bars", 0)) < 1200:
                  raise SystemExit(f"{tf}: insufficient historical bars.")
              bars_file = root / tf / "bars.csv"
              if not bars_file.is_file():
                  raise SystemExit(f"{tf}: common OHLC stream is missing.")
              with bars_file.open(newline="", encoding="utf-8") as handle:
                  bars = list(csv.DictReader(handle))
              if len(bars) != int(meta["bars_count"]):
                  raise SystemExit(f"{tf}: serialized OHLC row count mismatch.")
              stamps = [row["time"] for row in bars]
              if stamps != sorted(stamps) or len(stamps) != len(set(stamps)):
                  raise SystemExit(f"{tf}: OHLC timestamps are not unique and chronological.")
              bar_set = set(stamps)
              daily = {}
              for stamp in stamps:
                  day = stamp[:10].replace("-", "")
                  daily[day] = daily.get(day, 0) + 1
              if daily != meta.get("daily_bar_counts"):
                  raise SystemExit(f"{tf}: OHLC daily counts differ from metadata.")
              scores = section.get("scores", [])
              ais = section.get("ai_probabilities", [])
              threshold_order = section.get("threshold_order", [])
              if not scores or not ais or len(threshold_order) != len(scores) * len(ais):
                  raise SystemExit(f"{tf}: Score/AI grid does not match its axes.")
              if len(threshold_order) != len(set(threshold_order)):
                  raise SystemExit(f"{tf}: duplicate threshold IDs.")
              if set(section.get("strategies", {})) != set(strategies):
                  raise SystemExit(f"{tf}: strategy definitions are incomplete.")
              ready_total = 0
              live_baselines = 0
              for strategy in strategies:
                  strategy_section = section["strategies"][strategy]
                  candidate_order = strategy_section.get("candidate_order", [])
                  candidate_map = strategy_section.get("candidates", {})
                  expected_order = [f"{strategy}__{candidate}" for candidate in threshold_order]
                  if candidate_order != expected_order or set(candidate_order) != set(candidate_map):
                      raise SystemExit(f"{tf}/{strategy}: candidate matrix is incomplete.")
                  ready_for_strategy = 0
                  for candidate_id in candidate_order:
                      item = candidate_map[candidate_id]
                      if item.get("status") == "not_testable":
                          if not item.get("error"):
                              raise SystemExit(f"{tf}/{candidate_id}: missing non-testable reason.")
                          continue
                      if item.get("status") != "ready":
                          raise SystemExit(f"{tf}/{candidate_id}: invalid candidate status.")
                      threshold = item["threshold_id"]
                      candidate_dir = root / tf / "strategies" / strategy / "candidates" / threshold
                      metadata = json.loads((candidate_dir / "metadata.json").read_text(encoding="utf-8"))
                      signals = json.loads((candidate_dir / "signals.json").read_text(encoding="utf-8"))
                      if metadata.get("strategy") != candidate_id or metadata.get("candidate_id") != candidate_id:
                          raise SystemExit(f"{tf}/{candidate_id}: candidate identity mismatch.")
                      if metadata.get("strategy_type") != strategy or metadata.get("decision_only") is not True:
                          raise SystemExit(f"{tf}/{candidate_id}: strategy/decision-only metadata mismatch.")
                      if metadata.get("market_data_source") != source or int(metadata.get("bars_count", -1)) != len(bars):
                          raise SystemExit(f"{tf}/{candidate_id}: historical source/length mismatch.")
                      if len(signals) != int(metadata.get("signals_count", -1)):
                          raise SystemExit(f"{tf}/{candidate_id}: decision count mismatch.")
                      signal_times = [
                          datetime.fromisoformat(str(event["signal_time"]).replace("Z", "+00:00"))
                          .astimezone(timezone.utc).strftime("%Y-%m-%d %H:%M:%S.%f")
                          for event in signals
                      ]
                      if any(stamp not in bar_set for stamp in signal_times):
                          raise SystemExit(f"{tf}/{candidate_id}: decision does not map to original OHLC.")
                      if signal_times != sorted(signal_times) or len(signal_times) != len(set(signal_times)):
                          raise SystemExit(f"{tf}/{candidate_id}: decisions are not unique and ordered.")
                      if not isinstance(metadata.get("score_threshold"), (int, float)) or not isinstance(metadata.get("ai_threshold"), (int, float)):
                          raise SystemExit(f"{tf}/{candidate_id}: Score/AI metadata is missing.")
                      ready_for_strategy += 1
                      ready_total += 1
                      live_baselines += int(bool(metadata.get("is_live_baseline")))
                  if strategy_section.get("status") == "not_testable" and ready_for_strategy:
                      raise SystemExit(f"{tf}/{strategy}: status conflicts with ready candidates.")
              baseline_ready = section["strategies"]["baseline"].get("status") == "ready"
              expected_live_baselines = 1 if baseline_ready else 0
              if ready_total == 0 or live_baselines != expected_live_baselines:
                  raise SystemExit(
                      f"{tf}: live-baseline count is inconsistent with baseline readiness; "
                      f"ready_candidates={ready_total}, live_baselines={live_baselines}, "
                      f"baseline_ready={baseline_ready}."
                  )
              expected_total = len(strategies) * len(threshold_order)
              if int(meta.get("candidate_count_expected", -1)) != expected_total:
                  raise SystemExit(f"{tf}: candidate count does not match full matrix.")
              print(f"{tf}: verified {len(bars)} real OHLC bars; {ready_total}/{expected_total} candidates ready; one live baseline.")
          print("REAL_HISTORICAL_STRATEGY_THRESHOLD_INPUTS_VERIFIED")
          PY

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker system prune --all --force

      - name: Prepare standalone LEAN runtime
        env:
          LEAN_DIR: ${{ runner.temp }}/lean-lab
        run: |
          set -euo pipefail
          mkdir -p "$LEAN_DIR/Algorithm.Python" "$LEAN_DIR/config"
          cp lean_runtime/LeanBacktestAlgorithm.py "$LEAN_DIR/Algorithm.Python/"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/QuantConnect/Lean/master/Launcher/config.json \
            --output "$LEAN_DIR/config/lean.json"
          python - "$LEAN_DIR/config/lean.json" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          config = path.read_text()
          replacements = {
              '"algorithm-type-name": "BasicTemplateFrameworkAlgorithm"':
                  '"algorithm-type-name": "LeanBacktestAlgorithm"',
              '"algorithm-language": "CSharp"': '"algorithm-language": "Python"',
              '"algorithm-location": "QuantConnect.Algorithm.CSharp.dll"':
                  '"algorithm-location": "../../../Algorithm.Python/LeanBacktestAlgorithm.py"',
          }
          for old, new in replacements.items():
              if old not in config:
                  raise SystemExit(f"LEAN config template changed; missing {old}")
              config = config.replace(old, new, 1)
          path.write_text(config)
          PY

      - name: Pull official LEAN engine
        run: docker pull --platform linux/arm64 quantconnect/lean:latest

      - name: Execute every strategy-threshold candidate inside LEAN
        env:
          LEAN_DIR: \${{ runner.temp }}/lean-lab
          PREPARED_DIR: \${{ runner.temp }}/lean-lab/input
          TIMEFRAMES: \${{ inputs.timeframes }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p "$LEAN_DIR/results"
          for tf in 5m 15m 1h; do
            if [ "$TIMEFRAMES" != "all" ] && [[ ",$TIMEFRAMES," != *",$tf,"* ]]; then continue; fi
            for strategy in baseline trend_pullback breakout_retest momentum_continuation; do
              STRATEGY_INPUT="$PREPARED_DIR/$tf/strategies/$strategy/candidates"
              for CANDIDATE_INPUT in "$STRATEGY_INPUT"/*; do
                [ -d "$CANDIDATE_INPUT" ] || continue
                threshold_id="$(basename "$CANDIDATE_INPUT")"
                candidate_id="\${strategy}__\${threshold_id}"
                if [ ! -f "$CANDIDATE_INPUT/metadata.json" ]; then
                  echo "Skipping $tf/$candidate_id: candidate was not testable."
                  continue
                fi
                RESULT_DIR="$LEAN_DIR/results/$tf/$strategy/$candidate_id"
                mkdir -p "$RESULT_DIR"
                rm -rf "$LEAN_DIR/Algorithm.Python/input"
                mkdir -p "$LEAN_DIR/Algorithm.Python/input"
                cp "$PREPARED_DIR/$tf/bars.csv" "$LEAN_DIR/Algorithm.Python/input/bars.csv"
                cp "$CANDIDATE_INPUT/metadata.json" "$LEAN_DIR/Algorithm.Python/input/metadata.json"
                cp "$CANDIDATE_INPUT/signals.json" "$LEAN_DIR/Algorithm.Python/input/signals.json"
                echo "Running LEAN: $tf / $strategy / $threshold_id"
                docker run --rm --platform linux/arm64 \
                  --volume "$LEAN_DIR/Algorithm.Python:/Lean/Algorithm.Python:ro" \
                  --volume "$LEAN_DIR/config/lean.json:/Lean/Launcher/config.json:ro" \
                  --volume "$RESULT_DIR:/Results" \
                  quantconnect/lean:latest \
                  --results-destination-folder /Results \
                  --config /Lean/Launcher/config.json 2>&1 | tee "$RESULT_DIR/lean-engine.log"
                test -s "$RESULT_DIR/lean_report.json"
              done
            done
          done

      - name: Build verified combined strategy-threshold report
        env:
          LEAN_DIR: ${{ runner.temp }}/lean-lab
          REQUEST_ID: ${{ inputs.request_id }}
          ASSET: ${{ inputs.asset }}
        run: |
          python scripts/summarize_lean_strategy_lab.py \
            --prepared-dir "$LEAN_DIR/input" \
            --results-dir "$LEAN_DIR/results" \
            --output-dir "$LEAN_DIR/report" \
            --request-id "$REQUEST_ID" --asset "$ASSET"

      - name: Upload LEAN strategy-lab diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-strategy-lab-diagnostics-${{ inputs.request_id }}
          path: |
            ${{ runner.temp }}/lean-lab/input/
            ${{ runner.temp }}/lean-lab/results/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload verified LEAN strategy-lab report
        uses: actions/upload-artifact@v4
        with:
          name: lean-strategy-lab-${{ inputs.request_id }}
          path: ${{ runner.temp }}/lean-lab/report/
          if-no-files-found: error
          retention-days: 7

      - name: Notify Render so the combined report is delivered to Telegram
        if: always()
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, time, urllib.parse
          import requests
          base = os.environ["CALLBACK_URL"].rstrip("/")
          parsed = urllib.parse.urlparse(base)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("Callback URL must use HTTPS")
          payload = {"request_id": os.environ["REQUEST_ID"], "run_id": int(os.environ["RUN_ID"])}
          last = None
          for attempt in range(8):
              try:
                  response = requests.post(
                      base, json=payload,
                      headers={"Content-Type": "application/json"},
                      timeout=(10, 30),
                  )
                  if response.ok:
                      print("Render accepted the LEAN strategy-lab completion callback")
                      break
                  last = f"HTTP {response.status_code}: {response.text[:300]}"
              except Exception as exc:
                  last = f"{type(exc).__name__}: {exc}"
              time.sleep(min(5 * (attempt + 1), 30))
          else:
              raise SystemExit(f"Render callback failed after retries: {last}")
          PY
          if [ -f "$RUNNER_TEMP/lean-lab-render-keepalive.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/lean-lab-render-keepalive.pid")" || true
          fi
